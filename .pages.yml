# .pages.yml - Pages CMS configuration for kyokucho3.com

media:
  input: public/images
  output: /images

content:
  # 短歌（src/content/tanka）
  - name: tanka
    label: 短歌
    type: collection
    path: src/content/tanka
    # 初期値は日時で自動生成。新規作成時だけ入力欄が出て上書きできる
    filename:
      template: "{year}{month}{day}-{hour}{minute}{second}.md"
      field: create
    # 既存ファイルを編集・保存してもファイル名は変わらない
    operations:
      rename: false
    view:
      primary: body
      fields: [date, note]
    fields:
      - name: id
        label: ID（連番）
        type: number
        required: true
      - name: date
        label: 詠んだ日
        type: date
        format: "yyyy-MM-dd"
      - name: body
        label: 短歌本文
        type: string
        required: true
      - name: note
        label: 詞書・ひとこと（任意）
        type: string

  # 雑記（src/content/blog）
  - name: blog
    label: 雑記
    type: collection
    path: src/content/blog
    filename:
      template: "{year}{month}{day}-{hour}{minute}{second}.md"
      field: create
    operations:
      rename: false
    view:
      primary: title
      fields: [date, excerpt]
    fields:
      - name: id
        label: ID（連番）
        type: number
        required: true
      - name: title
        label: タイトル
        type: string
        required: true
      - name: date
        label: 日付
        type: date
        format: "yyyy-MM-dd"
      - name: excerpt
        label: 一言・要約（一覧に出る文）
        type: string
      - name: body
        label: 本文
        type: rich-text